  - name: "Llama-3.1-8B-Instruct-UD-IQ2_XXS.gguf"
    path: "models/Llama-3.1-8B-Instruct-UD-IQ2_XXS.gguf"

server:
  launch: true
  binary: "engines/llama.cpp/build/bin/llama-server"   # <-- important
  base_url: "http://127.0.0.1:8000/v1"
  api_key: "dummy"
  ctx_size: 4096
  startup_timeout_s: 180

benchmark:
  metrics_interval_s: 0.2
  

  defaults:
    samples: 100
    runs: 10
    warmup_samples: 20
    offset: 0
    inter_sample_delay_s: 1.0 

  datasets:
    - name: "mmlu"
      enabled: true
      max_tokens: 5

    - name: "hellaswag"
      enabled: true
      max_tokens: 5

    - name: "gsm8k"
      enabled: true
      max_tokens: 256
      inter_sample_delay_s: 2.0 

    - name: "dolly"
      enabled: false
      samples: 10
      runs: 10
      max_tokens: 256
      inter_sample_delay_s: 2.0 

generation:
  temperature: 0
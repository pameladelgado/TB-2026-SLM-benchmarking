  - name: "gemma-3-4b-it-q4_0_s.gguf"
    path: "models/gemma-3-4b-it-q4_0_s.gguf"

  - name: "granite-4.0-h-tiny-Q4_K_M.gguf"
    path: "models/granite-4.0-h-tiny-Q4_K_M.gguf"

  - name: "Llama-3.2-1B-Instruct-Q8_0.gguf"
    path: "models/Llama-3.2-1B-Instruct-Q8_0.gguf"

  - name: "Ministral-3-3B-Instruct-2512-Q4_K_M.gguf"

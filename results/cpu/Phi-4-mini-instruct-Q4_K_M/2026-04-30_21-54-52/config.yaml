server:
  launch: true
  binary: "/app/llama-server"
  base_url: "http://127.0.0.1:8000/v1"
  api_key: "dummy"

  # llama.cpp runtime
  ctx_size: 8192
  startup_timeout_s: 180

  # optional but recommended (prevents weird behavior)
  extra_args:
    - "--parallel"
    - "1"
    - "--threads"
    - "12"
    - "--threads-batch"
    - "12"

benchmark:
  metrics_interval_s: 0.2

  defaults:
    samples: 100
    runs: 10
    warmup_samples: 20
    offset: 0

  datasets:
    - name: "mmlu"
      enabled: true
      max_tokens: 5

    - name: "hellaswag"
      enabled: true
      max_tokens: 5

    - name: "gsm8k"
      enabled: true
      max_tokens: 256

    - name: "dolly"
      enabled: true
      samples: 100
      runs: 10
      max_tokens: 256


generation:
  temperature: 0


llama_bench:
  enabled: false
  binary: "/app/llama-bench"
  n_prompt: 512
  n_gen: 128
  repetitions: 3
  output_format: "csv"

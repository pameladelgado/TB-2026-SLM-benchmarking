server:
  launch: true
  binary: "vllm"
  base_url: "http://127.0.0.1:8000/v1"
  api_key: "dummy"
  startup_timeout_s: 360
  max_model_len: 2048
  gpu_memory_utilization: 0.9
  max_num_seqs: 1
  trust_remote_code: true
  enforce_eager: true
  pytorch_expandable_segments: true
  tensor_parallel_size: 2

benchmark:
  metrics_interval_s: 0.2

  defaults:
    samples: 100
    runs: 10
    warmup_samples: 20
    offset: 0

  datasets:
    - name: "mmlu"
      enabled: true
      max_tokens: 5

    - name: "hellaswag"
      enabled: true
      max_tokens: 5

    - name: "gsm8k"
      enabled: true
      max_tokens: 256
      warmup_samples: 20
      offset: 0

    - name: "dolly"
      enabled: true
      samples: 100
      runs: 10
      max_tokens: 256
      warmup_samples: 20
      offset: 0

generation:
  temperature: 0

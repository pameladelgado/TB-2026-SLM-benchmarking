model:
  name: "Phi-4-mini-instruct-Q4_K_M.gguf"
  path: "models/Phi-4-mini-instruct-Q4_K_M.gguf"

server:
  base_url: "http://127.0.0.1:8000/v1"
  api_key: "dummy"

benchmark:
  n_samples: 100
  n_runs: 10
  dolly_samples: 100
  dolly_runs: 10
  metrics_interval_s: 0.2

generation:
  temperature: 0
  max_tokens:
    mmlu: 5
    hellaswag: 5
    gsm8k: 16
    dolly: 100

llama_bench:
  enabled: true
  binary: "engines/llama.cpp/build/bin/llama-bench"
  n_prompt: 512
  n_gen: 128
  repetitions: 3
  output_format: "csv"
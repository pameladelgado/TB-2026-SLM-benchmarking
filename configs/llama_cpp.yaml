model:
  name: "Llama-3.1-8B-Instruct-UD-IQ2_XXS.gguf"
  path: "models/Llama-3.1-8B-Instruct-UD-IQ2_XXS.gguf"

server:
  binary: "engines/llama.cpp/build/bin/llama-server"
  base_url: "http://127.0.0.1:8000/v1"
  api_key: "dummy"
  ctx_size: 8192
  startup_timeout_s: 60
  log_path: "server.log"

benchmark:
  metrics_interval_s: 0.2

  defaults:
    samples: 100
    runs: 10

  datasets:
    - name: "mmlu"
      enabled: true
      max_tokens: 5

    - name: "hellaswag"
      enabled: true
      max_tokens: 5

    - name: "gsm8k"
      enabled: true
      max_tokens: 16

    - name: "dolly"
      enabled: true
      samples: 100
      runs: 10
      max_tokens: 100

generation:
  temperature: 0

llama_bench:
  enabled: true
  binary: "engines/llama.cpp/build/bin/llama-bench"
  n_prompt: 512
  n_gen: 128
  repetitions: 3
  output_format: "csv"
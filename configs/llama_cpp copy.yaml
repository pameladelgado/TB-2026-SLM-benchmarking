model:
  # This must match the model identifier expected by your OpenAI-compatible server.
  # In many llama.cpp server setups, this can be the GGUF filename or a server alias.
  name: "Llama-3.2-1B-Instruct-Q8_0.gguf"

  # Informational for now, but useful for reproducibility and for llama-bench.
  path: "models/Llama-3.2-1B-Instruct-Q8_0.gguf"

server:
  base_url: "http://127.0.0.1:8000/v1"
  api_key: "dummy"

benchmark:
  # Accuracy/system benchmark settings for MMLU / HellaSwag / GSM8K
  n_samples: 20
  n_runs: 5

  # Separate settings for Dolly workload
  dolly_samples: 50
  dolly_runs: 5

  # Target inline metric cadence.
  # This is best-effort, because sampling is done inline during streaming.
  metrics_interval_s: 0.2

generation:
  temperature: 0

  # Per-dataset generation caps
  max_tokens:
    mmlu: 5
    hellaswag: 5
    gsm8k: 32
    dolly: 128

llama_bench:
  enabled: true

  # Path to llama-bench binary
  binary: "engines/llama.cpp/llama-bench"

  # Path to GGUF file for llama-bench
  model: "models/Llama-3.2-1B-Instruct-Q8_0.gguf"

  # Synthetic benchmark settings
  n_prompt: 512
  n_gen: 128
  repetitions: 3

  # Try CSV output first
  output_format: "csv"